name: Extraire infos agences (GPT-OSS-120B via Cerebras)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de lignes à traiter dans ce run"
        default: "6024"
      force:
        description: "Retraiter même les lignes déjà vérifiées"
        type: boolean
        default: false
  # Reprend automatiquement chaque jour au reset du quota Cerebras (le
  # quota jour de Cerebras se réinitialise à minuit UTC) — inutile de
  # relancer manuellement pendant les ~2-3 jours que prend l'extraction
  # complète.
  schedule:
    - cron: "5 0 * * *"

permissions:
  contents: write
  actions: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer l'extraction
        id: run
        env:
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          RUN_LIMIT: ${{ github.event.inputs.limit || '10000' }}
          RUN_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          FORCE_FLAG=""
          if [ "$RUN_FORCE" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python extract_info.py --limit "$RUN_LIMIT" --time-budget-minutes 320 $FORCE_FLAG

      - name: Commit et push les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extraction_results.jsonl
          git diff --quiet --cached || git commit -m "Extraction GPT-OSS-120B (Cerebras) agences ($(date -I))"
          git push
          # ⚠️ prospection.csv n'est plus modifié par ce job.
          # Une fois les résultats vérifiés (voir logs ci-dessus et
          # extraction_results.jsonl), lance localement :
          #   python merge_results.py          (ou --dry-run pour vérifier avant)

      # Ne se déclenche QUE si le budget de temps (320 min) a été atteint
      # avec du travail restant — PAS si c'est le quota journalier
      # Cerebras qui est épuisé (dans ce cas, inutile d'insister : ça ne
      # reviendra pas avant le reset quotidien, géré par le "schedule"
      # ci-dessus). Ça évite de gaspiller des minutes GitHub Actions à
      # boucler toutes les 5 minutes pendant des heures pour rien.
      - name: Attendre 5 min puis relancer si travail restant (hors quota jour)
        if: steps.run.outputs.remaining == 'true' && steps.run.outputs.daily_quota_exhausted != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_LIMIT: ${{ github.event.inputs.limit || '10000' }}
          RUN_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          echo "Il reste des lignes à traiter, redémarrage dans 5 minutes..."
          sleep 300
          gh workflow run extract_info.yml \
            -f limit="$RUN_LIMIT" \
            -f force="$RUN_FORCE"

      - name: Info quota journalier atteint
        if: steps.run.outputs.daily_quota_exhausted == 'true'
        run: |
          echo "📅 Quota journalier Cerebras atteint sur au moins une clé."
          echo "Le déclenchement quotidien automatique (cron 00:05 UTC) reprendra le travail restant demain."
