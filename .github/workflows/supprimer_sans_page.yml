name: Supprimer agences sans page (refair)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation uniquement (rien n'est modifié)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer la suppression
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            FLAG="--dry-run"
          fi
          python supprimer_sans_page.py $FLAG

      - name: Commit et push les changements
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prospection.csv prospection.csv.bak
          git diff --quiet --cached || git commit -m "Suppression agences sans page refair ($(date -I))"
          git push
